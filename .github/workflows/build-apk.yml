name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle Wrapper
        working-directory: ./android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || {
            ERR_DETAILS=$(grep -A 8 "What went wrong:" build.log | tr '\n' ' -- ')
            echo "::error::$ERR_DETAILS"
            exit 1
          }

      - name: Locate and Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClip-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
